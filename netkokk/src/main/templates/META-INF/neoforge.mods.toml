modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Kokk"
description='''
Миры «по сети» видны через все сетевые карты: Radmin, ZeroTier, Hamachi, любые VPN. Адреса для друзей в чате, вход и для Ely.by, и для офлайн-ников.
LAN worlds over every network adapter (Radmin, ZeroTier, Hamachi, any VPN), join addresses in chat, mixed Ely.by and offline players.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
