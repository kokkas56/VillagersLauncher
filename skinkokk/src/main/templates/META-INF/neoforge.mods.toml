modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Kokk"
description='''
Свои скины и плащи из VillagersLauncher: видны всем игрокам сборки, меняются без перезапуска, гардероб в игре (клавиша K).
Custom skins and capes from VillagersLauncher: synced to every player, swapped live, in-game wardrobe (K key).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
