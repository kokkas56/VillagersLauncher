name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check sources
        run: npm run check
      - name: Build UI
        run: npm run build:ui
      - name: Build installer (release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Build installer (nightly)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --publish never
      - name: Upload nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly" --notes "Тестовая сборка лаунчера с ветки main" --target main
          for f in release/*.exe; do cp "$f" "release/VillagersLauncher-nightly.exe"; done
          gh release upload nightly release/VillagersLauncher-nightly.exe --clobber

  skinkokk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skinkokk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: chmod +x ./gradlew && ./gradlew build --no-configuration-cache
      - name: Publish jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/libs/skinkokk-*.jar ../skinkokk.jar 2>/dev/null || cp $(ls build/libs/*.jar | grep -v sources | head -1) ../skinkokk.jar
          cd ..
          gh release view skinkokk >/dev/null 2>&1 || gh release create skinkokk --prerelease --title "SkinKokk mod" --notes "Мод SkinKokk для сборки (собирается автоматически)" --target main
          gh release upload skinkokk skinkokk.jar --clobber
