name: Build

on:
  push:
    branches: [main, release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check sources
        run: npm run check
      - name: Build UI
        shell: bash
        run: set -o pipefail && npm run build:ui 2>&1 | tee ui-build.log
      - name: Upload log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI logs" --notes "Логи сборки" --target main
          [ -f ui-build.log ] && gh release upload ci-logs ui-build.log --clobber || true
      - name: Build installer (release)
        if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Build installer (nightly)
        if: ${{ github.ref != 'refs/heads/release' && !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --publish never
      - name: Upload nightly
        if: ${{ github.ref != 'refs/heads/release' && !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly" --notes "Тестовая сборка лаунчера с ветки main" --target main
          for f in release/*.exe; do cp "$f" "release/VillagersLauncher-nightly.exe"; done
          gh release upload nightly release/VillagersLauncher-nightly.exe --clobber
          powershell -Command "Compress-Archive -Path dist/* -DestinationPath ui-dist.zip -Force"
          gh release upload nightly ui-dist.zip --clobber

  mods:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [skinkokk, netkokk]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: chmod +x ./gradlew && set -o pipefail && ./gradlew build --no-configuration-cache 2>&1 | tee ../${{ matrix.mod }}-build.log
      - name: Upload log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI logs" --notes "Логи сборки" --target main
          gh release upload ci-logs ${{ matrix.mod }}-build.log --clobber
      - name: Publish jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp $(ls build/libs/*.jar | grep -v sources | head -1) ../${{ matrix.mod }}.jar
          cd ..
          gh release view ${{ matrix.mod }} >/dev/null 2>&1 || gh release create ${{ matrix.mod }} --prerelease --title "${{ matrix.mod }} mod" --notes "Мод для сборки (собирается автоматически)" --target main
          gh release upload ${{ matrix.mod }} ${{ matrix.mod }}.jar --clobber
